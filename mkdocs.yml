site_name: Prashant Gore
site_description: Personal insights, frameworks and AI projects exploring digital transformation in Pharmacovigilance and Life Sciences
site_author: Prashant Gore
site_url: https://prashantrgore.github.io

theme:
  name: material
  language: en

  palette:
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - navigation.expand
    - search.highlight
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Consulting Notes:
    - Overview: consulting-briefs/README.md
    - "Note #001 — Stop Paving the Cow Path": consulting-briefs/brief-001.md
  - Frameworks: frameworks/README.md
  - Projects: projects/README.md
  - About: about/README.md
  - Contact: contact/README.md

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - assets/stylesheets/extra.css
